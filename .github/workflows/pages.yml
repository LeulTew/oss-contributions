name: Refresh public contribution dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

concurrency:
  group: public-contribution-pages
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pinned Markdown parsers without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test dashboard
        run: node --test
      - name: Hash selected contribution manifest
        id: manifest
        run: |
          node --input-type=module -e "import{readFileSync,appendFileSync}from'node:fs';import{manifestHash}from'./scripts/collect.mjs';appendFileSync(process.env.GITHUB_OUTPUT,'hash='+manifestHash(JSON.parse(readFileSync('config/contributions.json','utf8')))+'\n')"
      - name: Restore verified observations
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/contributions.json
          key: observations-v2-${{ runner.os }}-${{ steps.manifest.outputs.hash }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            observations-v2-${{ runner.os }}-${{ steps.manifest.outputs.hash }}-
      - name: Collect public GitHub evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/collect.mjs
      - name: Build static artifact
        run: node scripts/build.mjs
      - name: Save verified observations
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/contributions.json
          key: observations-v2-${{ runner.os }}-${{ steps.manifest.outputs.hash }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Deploy static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
